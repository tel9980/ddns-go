name: Build and publish optimized image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Reserved for the optional cosign keyless signing step below. Keeping it
  # declared is harmless; the signing step itself is currently commented out.
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ddns-go

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=optimized
            type=raw,value=ddns-go-optimized
            type=raw,value=${{ steps.version.outputs.value }}
            type=ref,event=tag
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.optimized
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:optimized

      # ---- Supply chain hardening (observation mode) -----------------------
      # Vulnerability scan: fail-build:false keeps the workflow green while we
      # observe findings. SARIF upload is intentionally omitted for now (would
      # require security-events: write and code-scanning enablement).
      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:optimized
          fail-build: false
          severity-cutoff: critical
          output-format: table

      # SPDX SBOM, uploaded as a workflow artifact. anchore/sbom-action@v0 is
      # a known published major and runs on node24; it also uploads an artifact
      # by default, so we disable that and use the repo-standard actions/upload-artifact@v7
      # (also node24) for a single, predictably named artifact.
      - name: Generate SPDX SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:optimized
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-optimized
          path: sbom.spdx.json

      # Optional follow-up (not enabled): keyless signing with cosign requires
      # resolving the pushed digest (e.g. from steps.build.outputs.digest) and
      # the id-token: write permission declared above. Enable once the digest
      # output and registry auth have been verified on a real push:
      #
      # - name: Install cosign
      #   uses: sigstore/cosign-installer@v3
      # - name: Sign image
      #   env:
      #     COSIGN_EXPERIMENTAL: "1"
      #   run: |
      #     cosign sign --yes \
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
